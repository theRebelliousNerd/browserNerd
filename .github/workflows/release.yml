name: Release Extension
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || true # ignore if no package-lock.json

      - name: Build and Package binaries
        run: |
          mkdir -p release
          cd mcp-server
          
          # Build cross-platform binaries
          GOOS=darwin GOARCH=arm64 go build -o ../bin/browsernerd-darwin-arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -o ../bin/browsernerd-darwin-amd64 ./cmd/server
          GOOS=linux GOARCH=amd64 go build -o ../bin/browsernerd-linux-amd64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -o ../bin/browsernerd-windows-amd64.exe ./cmd/server
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/browsernerd-darwin-arm64
            bin/browsernerd-darwin-amd64
            bin/browsernerd-linux-amd64
            bin/browsernerd-windows-amd64.exe
          generate_release_notes: true
